name: Mac check

# Started by hand. On a real Mac: runs the tests, builds the app the way a
# release does, checks its signature and opens it, with screenshots to look at.
on:
  workflow_dispatch:

jobs:
  mac-check:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Show the Tk version
        run: python -c "import tkinter; r = tkinter.Tk(); print('Tk', r.tk.eval('info patchlevel')); r.destroy()"
      - name: Run the tests
        id: tests
        continue-on-error: true
        run: python tests/run_all.py
      - name: Build the app
        run: |
          chmod +x make_icns.sh
          ./make_icns.sh
          python -m PyInstaller --clean OSRS_Tracker.spec
      - name: Check the signature
        run: codesign --verify --deep --strict --verbose=2 "dist/OSRS Tracker.app"
      - name: Open the app
        run: |
          mkdir -p evidence
          APP="$PWD/dist/OSRS Tracker.app/Contents/MacOS/OSRS Tracker"

          # $1: name for its files. Everything the app saves goes in its own
          # home folder, which the caller may have set up first.
          open_app() {
              HOME="$2" "$APP" &
              pid=$!
              sleep 40
              screencapture -x "evidence/$1.png" || echo "No screenshot for $1"
              cp "$2/Library/Application Support/OSRS Tracker/osrs_tracker.log" "evidence/$1.log" || true
              if ! kill -0 "$pid" 2>/dev/null; then
                  echo "::error::The app quit by itself ($1)"
                  cat "evidence/$1.log" || true
                  exit 1
              fi
              kill "$pid"
              wait "$pid" || true
              cat "evidence/$1.log" || true
              if grep -E "ERROR|CRITICAL|Traceback" "evidence/$1.log"; then
                  echo "::error::The log has errors ($1)"
                  exit 1
              fi
          }

          # A first launch stops at the contact dialog.
          FIRST="$(mktemp -d)"
          open_app first-launch "$FIRST"

          # With a contact saved, it goes on to the main window and real prices.
          MAIN="$(mktemp -d)"
          mkdir -p "$MAIN/Library/Application Support/OSRS Tracker"
          echo '{"ua_contact": "dev-check"}' > "$MAIN/Library/Application Support/OSRS Tracker/settings.json"
          open_app main-window "$MAIN"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-check
          path: evidence/
      - name: Fail if the tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Some tests failed on the Mac. See the Run the tests step."
          exit 1
