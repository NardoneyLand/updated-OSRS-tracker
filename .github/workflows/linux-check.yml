name: Linux check

# Started by hand. Runs the tests on Ubuntu with the system's Python, the way
# launch.sh does, on a virtual display.
on:
  workflow_dispatch:

jobs:
  linux-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv xvfb openbox fonts-liberation
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Run the tests
        run: xvfb-run -a -s "-screen 0 1920x1080x24" bash -c 'openbox & sleep 2; .venv/bin/python tests/run_all.py'
