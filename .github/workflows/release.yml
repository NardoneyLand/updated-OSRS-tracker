name: Release

# Push a tag like v1.0.0 to build the Windows installer and macOS .dmg and
# publish them to a GitHub Release. Can also be run by hand (artifacts only).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build .exe
        shell: pwsh
        run: ./build.ps1
      - name: Build installer
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          if ($v -notmatch '^\d') { $v = '0.0.0' }
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/OSRS-Tracker-Setup-*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build .app
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          chmod +x make_icns.sh
          ./make_icns.sh
          python -m PyInstaller --clean OSRS_Tracker.spec
      - name: Package .dmg
        run: |
          V="${GITHUB_REF_NAME#v}"
          case "$V" in [0-9]*) ;; *) V=0.0.0;; esac
          mkdir -p stage
          cp -R "dist/OSRS Tracker.app" stage/
          ln -s /Applications stage/Applications
          hdiutil create -volname "OSRS Tracker" -srcfolder stage -ov -format UDZO \
            "dist/OSRS-Tracker-$V.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/OSRS-Tracker-*.dmg

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* \
            --repo "${{ github.repository }}" \
            --title "OSRS Tracker ${{ github.ref_name }}" \
            --generate-notes
